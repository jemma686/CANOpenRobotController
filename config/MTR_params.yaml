#   MTRobot parameter file
#
#   2-DOF parallel-linkage tabletop therapy robot.
#   This file is the canonical source — it lives outside the CORC submodule.
#   CMakeLists.txt copies it to build/config/ at configure time so that
#   Robot::initialiseFromYAML() can find it during NO_ROBOT development builds.
#
#   Arm geometry sourced from System Modelling/torquecalc (1).m.
#   Joint limits sourced from System Modelling/ROM (1).m and accelCalc (1).m.
#
#   To load this file, construct RobotMTR with:
#       RobotMTR("RobotMTR", "MTR_params.yaml")
#
#   Parameter status legend:
#     VERIFIED   — confirmed against hardware or datasheet
#     ESTIMATE   — reasonable guess; replace after system identification
#     MUST VERIFY — MUST be measured on physical robot before use
#
#   Diagram (top view, horizontal plane)
#
#   Origin (shoulder)
#       ●──────────────● θ₁  (proximal joint, Drive 1, CAN ID 2)
#                       └─────────────── θ₂  (elbow, Drive 2, CAN ID 4)
#                                        └── ● Handle (end-effector)
#
#   θ₁ ∈ [−30°, 100°]   measured from the +X axis
#   θ₂ ∈ [−160°, −30°]  measured from link-1 direction (always inward/negative)
#

RobotMTR:

  # ── Geometry ─────────────────────────────────────────────────────────────────
  # Status: MUST VERIFY — measure physical links before enabling forward kinematics.
  # Source: System Modelling/torquecalc (1).m
  L1: 0.43          # Proximal link length [m]  (shoulder → elbow pivot)
  L2: 0.37          # Distal   link length [m]  (elbow pivot → handle)

  # Status: MUST VERIFY — depends on parallelogram linkage design.
  # 1.0 means motor encoder directly reads the geometric elbow angle change.
  parallel_ratio: 1.0

  # ── Drive envelope ────────────────────────────────────────────────────────────
  # dqMax — joint velocity safety limit [deg/s].
  #   Only enforced when NOT calibrated (bench/startup safety check).
  #   After calibration, end-effector velocity (2.0 m/s, hardcoded) is the active limit.
  #   200 deg/s is a safe value with the arm physically attached.
  #   For free-shaft bench testing increase to ~700 (observed ~600 deg/s in free spin).
  # Status: BENCH TEST value — increase back to 200 before arm-attached therapy testing.
  dqMax:  700        # [deg/s] — bench test value; restore to 200 for arm-attached therapy use

  # tauMax — joint torque command cap [N·m].
  #   Applied in setTorque() (commands rejected above this) and setEndEffForceWithCompensation()
  #   (joints clamped to ±tauMax before commanding).
  #   NOT a calibrated-mode safety trigger — that uses end-effector velocity and position limits.
  #
  #   Motor rated torque:   0.319 N·m  (nameplate — confirmed via 0x6076 readback)
  #   Motor rated current:  0.319 / 0.114 = 2.80 A
  #   Copley ±3200 per-mille range → max commandable = 3.2 × 0.319 = 1.02 N·m (8.9 A)
  #   WARNING: sustained commands above ~0.319 N·m (rated) will overheat the motor.
  #   0.4 N·m (125 % of rated) is acceptable for brief bench tests; use ≤ 0.319 for therapy.
  # Status: BENCH TEST value — reduce to 0.319 or below for sustained therapy operation.
  tauMax:  0.4

  # ── Per-joint drive parameters ────────────────────────────────────────────────
  # Status: VERIFIED — 0x6076 (Motor Rated Torque) = 319 mN·m is the correct nameplate value
  #   for the Maxon EC60 motors fitted. Rated current = 319/114 = 2.798 A, confirming
  #   iPeakDrives = 2.7 A. No CME2 change is needed; 0x6076 is correctly configured.
  #   NOTE: 6.0 A is the Copley ACK-055-06 drive's own continuous output rating —
  #   it is NOT the motor's rated current. Commanding sustained torque above 0.319 N·m
  #   runs the motor above its thermal limit.
  iPeakDrives:  [2.795, 2.795]   # Motor rated current: 0.319 N·m / 0.114 N·m/A = 2.80 A
  motorCstt:    [0.114, 0.114]   # Maxon EC60 Kt [N·m/A]

  # Status: VERIFIED — qSigns confirmed correct direction during motor spin tests.
  qSigns:       [1, -1]           # +1 = positive torque → increasing joint angle

  # ── Joint limits ──────────────────────────────────────────────────────────────
  # Status: MUST VERIFY — these are design values from system modelling.
  #   Confirm actual mechanical limits by commanding motion toward each stop.
  # Format: [θ1_min, θ1_max, θ2_min, θ2_max] in degrees
  qLimits: [-30, 100, -160, -30]

  # ── Calibration ───────────────────────────────────────────────────────────────
  # Status: MUST VERIFY — read raw encoder angles from Copley drive at each hard stop
  #   (PCAN-View / candump SDO read of 0x6064) and replace these values.
  #   CalibState drives both joints with positive torque until motion stops then applies
  #   these as the known positions. Wrong values corrupt ALL kinematic and force control.
  # Format: [θ₁_stop_deg, θ₂_stop_deg]  (positive torque → stop at θ_max by default)
  qCalibration: [100, -30]    # [θ₁_max_stop, θ₂_max_stop] — MUST VERIFY on hardware

  # ── Friction model ────────────────────────────────────────────────────────────
  # Status: ESTIMATE — replace after system identification.
  #   Coulomb 0.5 N·m = 73% of rated motor torque per joint. This is very aggressive
  #   and will dominate force commands until identified properly.
  #   Set both to 0.0 for initial therapy testing; add back after measuring on hardware.
  # Applied in setEndEffForceWithCompensation():
  #   τ_fric = frictionCoul × sign(dq) + frictionVis × dq   (gated by 0.03 rad/s deadband)
  frictionVis:  [0.0, 0.0]    # Viscous  [N·m·s/rad] — zeroed until system ID
  frictionCoul: [0.0, 0.0]    # Coulomb  [N·m]       — zeroed until system ID

  # ── Safety envelope ──────────────────────────────────────────────────────────
  # Status: VERIFIED reasonable — motors physically cannot produce 20 N at end-effector
  #   (~5 N max from joint torque via Jᵀ), so this cap is a backstop against calculation errors.
  #   Review before clinical use with patients.
  maxEndEffForce: 20.0        # Max end-effector contact force (XY) [N]
